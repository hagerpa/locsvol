[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "locsvol"
version = "1.0.1"
description = "Calibration of local stochastic volatility models by fixed-point iteration"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Paul P. Hager" },
]
keywords = ["local stochastic volatility", "calibration", "fixed-point iteration", "Monte Carlo", "JAX"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
]

[project.urls]
Repository = "https://github.com/hagerpa/locsvol"

[project.optional-dependencies]
heston = ["roughprix==0.1.0"]
study = [
    "matplotlib==3.10.8",
    "wrds==3.5.0",
    "roughprix==0.1.0",
]
dev = ["pytest==9.1.1", "ruff==0.15.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
